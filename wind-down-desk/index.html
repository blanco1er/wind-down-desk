<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Automatic translation (Chrome on iPhone) rewrote the interface into overlapping text: the app is in English. -->
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#0d0b0a" />
    <meta name="description" content="A seated, hands-first evening ritual for Meta Quest: say what is on your mind, sort it by hand, let go, sleep." />
    <link rel="icon" href="data:," />
    <title>Wind-Down Desk</title>
    <style>
      /* Tokens mirror src/desk/design-tokens.ts (warm visionOS-style glass, one lamp accent, sentence case). */
      @font-face {
        font-family: 'Manrope';
        src: url('./fonts/Manrope-Variable.ttf') format('truetype');
        font-weight: 200 800;
        font-display: swap;
      }
      :root {
        --ink: #0d0b0a;
        --glass-top: rgba(58, 55, 52, 0.62);
        --glass-bottom: rgba(34, 32, 30, 0.72);
        --edge: rgba(255, 250, 240, 0.26);
        --primary: rgba(255, 255, 255, 0.96);
        --secondary: rgba(235, 235, 245, 0.66);
        --tertiary: rgba(235, 235, 245, 0.42);
        --amber: #f4c27e;
        --font: 'Manrope', 'SF Pro Display', 'SF Pro Text', 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        /* Night room behind the transparent canvas: a warm pool of lamp light, then a soft vignette. */
        background: radial-gradient(ellipse 70% 62% at 52% 40%, #2b2018 0%, #17110d 48%, #0a0807 100%) var(--ink);
        color: var(--primary);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
      }
      /* The scene fades in only once it is drawn with its textures: no loading flash, no half-rendered tray. */
      #scene-container {
        opacity: 0;
        transition: opacity 1100ms cubic-bezier(0.25, 0.1, 0.25, 1);
      }
      body.ready #scene-container {
        opacity: 1;
      }
      #loading {
        position: fixed;
        left: 50%;
        bottom: max(48px, 8vh);
        width: 44px;
        height: 2px;
        margin-left: -22px;
        border-radius: 1px;
        overflow: hidden;
        background: rgba(255, 245, 230, 0.12);
        transition: opacity 400ms ease;
      }
      #loading::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 1px;
        background: var(--amber);
        animation: slide 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
      }
      @keyframes slide {
        to {
          transform: translateX(150%);
        }
      }
      body.ready #loading {
        opacity: 0;
      }
      #landing {
        position: fixed;
        inset: auto 0 0 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 0 max(16px, env(safe-area-inset-left)) calc(max(48px, 6vh) + env(safe-area-inset-bottom));
        transition: opacity 500ms cubic-bezier(0.2, 0.8, 0.2, 1);
        z-index: 10;
        pointer-events: none;
      }
      #landing.hidden {
        opacity: 0;
      }
      /* One small glass bar, low and centred: the tray and its lamp are the hero. */
      .bar {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 22px;
        max-width: 100%;
        box-sizing: border-box;
        padding: 8px 8px 8px 22px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--glass-top), var(--glass-bottom));
        backdrop-filter: blur(24px) saturate(1.4);
        -webkit-backdrop-filter: blur(24px) saturate(1.4);
        box-shadow: inset 0 1px 0 var(--edge), 0 14px 40px rgba(0, 0, 0, 0.38);
        opacity: 0;
        transform: translateY(10px) scale(0.98);
        transition: opacity 600ms ease 1700ms, transform 700ms cubic-bezier(0.2, 0.9, 0.25, 1.05) 1700ms;
      }
      body.ready .bar {
        opacity: 1;
        transform: none;
      }
      #landing.hidden .bar {
        pointer-events: none;
      }
      .brand {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .name {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.005em;
        white-space: nowrap;
      }
      .sub {
        font-size: 12.5px;
        color: var(--secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bar[hidden],
      .xr-alert[hidden],
      .qc-address-hint:empty {
        display: none !important;
      }
      /* 23 Oct: Accessibility · Privacy · Not therapy or medical advice — small, always reachable. */
      .legal {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: calc(4px + env(safe-area-inset-bottom));
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        column-gap: 4px;
        font-size: 12px;
        letter-spacing: 0.01em;
        color: rgba(240, 228, 212, 0.5);
        pointer-events: none;
      }
      .legal a,
      .legal button {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 0 8px;
        border: 0;
        border-radius: 10px;
        background: none;
        color: rgba(246, 236, 222, 0.78);
        font: 600 12px var(--font);
        text-decoration: none;
        cursor: pointer;
      }
      .legal a:hover,
      .legal button:hover {
        color: var(--primary);
      }
      .legal a:focus-visible,
      .legal button:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.7);
        outline-offset: 0;
      }
      .legal .dot {
        opacity: 0.6;
      }
      #landing.hidden .legal {
        visibility: hidden;
      }
      /* Accessibility settings: a native dialog (focus trapped, Escape closes), three switches. */
      #access {
        box-sizing: border-box;
        max-width: none;
        width: min(440px, calc(100vw - 32px));
        padding: 22px 22px 18px;
        border: 0;
        border-radius: 26px;
        color: var(--primary);
        background: linear-gradient(180deg, rgba(58, 55, 52, 0.96), rgba(30, 28, 26, 0.98));
        box-shadow: inset 0 1px 0 var(--edge), 0 24px 60px rgba(0, 0, 0, 0.55);
        font-family: var(--font);
      }
      #access::backdrop {
        background: rgba(8, 6, 5, 0.6);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      #access h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 650;
      }
      #access .access-lede {
        margin: 4px 0 14px;
        font-size: 13.5px;
        color: var(--secondary);
      }
      .sw {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 12px 0;
        border-top: 1px solid rgba(255, 250, 240, 0.1);
        cursor: pointer;
      }
      .sw b {
        display: block;
        font-size: 15px;
        font-weight: 600;
      }
      .sw small {
        display: block;
        margin-top: 2px;
        font-size: 13px;
        line-height: 1.4;
        color: var(--secondary);
      }
      .sw input {
        appearance: none;
        -webkit-appearance: none;
        flex: none;
        position: relative;
        width: 50px;
        height: 30px;
        margin: 2px 0 0;
        border-radius: 15px;
        background: rgba(120, 120, 128, 0.42);
        transition: background 180ms ease;
        cursor: pointer;
      }
      .sw input::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .sw input:checked {
        background: var(--amber);
      }
      .sw input:checked::after {
        transform: translateX(20px);
      }
      .sw input:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.8);
        outline-offset: 2px;
      }
      #access .access-done {
        display: block;
        width: 100%;
        min-height: 46px;
        margin-top: 8px;
        border: 0;
        border-radius: 23px;
        background: var(--amber);
        color: #1c1612;
        font: 600 15px var(--font);
        cursor: pointer;
      }
      #access .access-done:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.8);
        outline-offset: 2px;
      }
      /* The settings apply to this page too. */
      body.a11y-contrast {
        --glass-top: rgba(10, 9, 8, 0.96);
        --glass-bottom: rgba(4, 4, 4, 0.98);
        --edge: rgba(255, 255, 255, 0.7);
        --secondary: rgba(255, 255, 255, 0.92);
        --tertiary: rgba(255, 255, 255, 0.82);
      }
      body.a11y-contrast .legal,
      body.a11y-contrast .legal a,
      body.a11y-contrast .legal button {
        color: #fff;
      }
      body.a11y-large #landing {
        zoom: 1.15;
      }
      /* The dialog keeps its width (it must fit a 390 px phone); its text grows instead. */
      body.a11y-large #access h2 { font-size: 22px; }
      body.a11y-large #access .access-lede,
      body.a11y-large .sw small { font-size: 15px; }
      body.a11y-large .sw b { font-size: 17px; }
      /* On a phone the line wraps after Privacy: no dot left alone at the end of a line. */
      @media (max-width: 620px) {
        .legal .dot-last { display: none; }
        .legal .medical { flex-basis: 100%; text-align: center; }
      }
      .sub:empty {
        display: none;
      }
      #begin {
        appearance: none;
        border: 0;
        flex: none;
        min-height: 44px;
        padding: 0 24px;
        border-radius: 22px;
        font: 600 15px var(--font);
        color: #1c1612;
        background: var(--amber);
        cursor: pointer;
        transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1), filter 180ms ease;
      }
      #begin:hover:not(:disabled) {
        transform: scale(1.03);
        filter: brightness(1.06);
      }
      #begin:active:not(:disabled) {
        transform: scale(0.97);
      }
      #begin:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.7);
        outline-offset: 3px;
      }
      #begin:disabled {
        opacity: 0.6;
        cursor: default;
      }
      /* First visit: two glass cards in the same bar; one touch chooses and begins. */
      .choose {
        display: flex;
        gap: 8px;
      }
      .choose[hidden] {
        display: none;
      }
      .card {
        appearance: none;
        border: 1px solid rgba(255, 245, 230, 0.16);
        background: rgba(255, 245, 230, 0.07);
        color: var(--primary);
        border-radius: 22px;
        padding: 10px 18px 11px;
        min-width: 172px;
        text-align: left;
        cursor: pointer;
        font: inherit;
        transition: background 180ms ease, transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1), border-color 180ms ease;
      }
      .card b {
        display: block;
        font-size: 15px;
        font-weight: 600;
      }
      .card span {
        display: block;
        font-size: 12.5px;
        color: var(--secondary);
        margin-top: 2px;
      }
      .card:hover {
        background: rgba(244, 194, 126, 0.18);
        border-color: rgba(244, 194, 126, 0.5);
        transform: translateY(-1px);
      }
      .card:active {
        transform: scale(0.97);
      }
      .card:focus-visible,
      .style:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.7);
        outline-offset: 3px;
      }
      #landing.first .bar {
        border-radius: 32px;
      }
      .style {
        appearance: none;
        border: 0;
        background: none;
        color: var(--secondary);
        font: 500 13px var(--font);
        cursor: pointer;
        padding: 6px 4px;
        white-space: nowrap;
        text-decoration: underline;
        text-decoration-color: rgba(235, 235, 245, 0.3);
        text-underline-offset: 3px;
      }
      .style[hidden],
      #begin[hidden] {
        display: none;
      }
      .style:hover {
        color: var(--primary);
      }
      @media (max-width: 620px) {
        #landing.first .bar {
          flex-direction: column;
          align-items: stretch;
          padding: 16px;
        }
        .choose {
          flex-direction: column;
        }
      }
      /* 22 Oct: no immersive session here (phone, laptop without a headset): the "Made for Meta Quest" card.
         The scene lifts a little so the card never covers the front of the tray. */
      body.noxr #scene-container {
        transform: translateY(-9vh);
      }
      .quest-card {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 28px;
        width: 100%;
        max-width: 660px;
        box-sizing: border-box;
        padding: 26px 26px 24px 30px;
        border-radius: 30px;
        background: linear-gradient(180deg, var(--glass-top), var(--glass-bottom));
        backdrop-filter: blur(24px) saturate(1.4);
        -webkit-backdrop-filter: blur(24px) saturate(1.4);
        box-shadow: inset 0 1px 0 var(--edge), 0 18px 48px rgba(0, 0, 0, 0.42);
        opacity: 0;
        transform: translateY(12px) scale(0.985);
        transition: opacity 600ms ease 900ms, transform 700ms cubic-bezier(0.2, 0.9, 0.25, 1.05) 900ms;
      }
      body.ready .quest-card {
        opacity: 1;
        transform: none;
      }
      #landing.hidden .quest-card {
        pointer-events: none;
      }
      .qc-text {
        flex: 1;
        min-width: 0;
      }
      .qc-eyebrow {
        margin: 0 0 6px;
        font-size: 11.5px;
        font-weight: 650;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--amber);
      }
      .qc-title {
        margin: 0;
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.015em;
        line-height: 1.15;
      }
      .qc-lede {
        margin: 8px 0 16px;
        font-size: 14.5px;
        line-height: 1.45;
        color: var(--secondary);
        max-width: 38ch;
      }
      .qc-step {
        margin: 0 0 7px;
        font-size: 12.5px;
        color: var(--tertiary);
      }
      .qc-address {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        max-width: 100%;
        min-height: 46px;
        box-sizing: border-box;
        padding: 0 14px 0 16px;
        border-radius: 14px;
        border: 1px solid rgba(255, 245, 230, 0.18);
        background: rgba(255, 245, 230, 0.08);
        color: var(--primary);
        font: 600 16.5px var(--font);
        letter-spacing: 0.005em;
        cursor: pointer;
        transition: background 180ms ease, border-color 180ms ease;
      }
      .qc-address:hover {
        background: rgba(244, 194, 126, 0.14);
        border-color: rgba(244, 194, 126, 0.45);
      }
      .qc-address-text {
        overflow-wrap: anywhere;
        text-align: left;
      }
      .qc-address-hint {
        flex: none;
        font: 600 12px var(--font);
        color: var(--amber);
      }
      .qc-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }
      .qc-primary,
      .qc-secondary,
      .xr-alert-primary,
      .xr-alert-secondary {
        appearance: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 22px;
        border-radius: 22px;
        font: 600 15px var(--font);
        text-decoration: none;
        cursor: pointer;
        transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1), filter 180ms ease, background 180ms ease;
      }
      .qc-primary,
      .xr-alert-primary {
        border: 0;
        color: #1c1612;
        background: var(--amber);
      }
      .qc-secondary,
      .xr-alert-secondary {
        border: 1px solid rgba(255, 245, 230, 0.2);
        color: var(--primary);
        background: rgba(255, 245, 230, 0.07);
      }
      .qc-primary:hover,
      .xr-alert-primary:hover {
        transform: scale(1.03);
        filter: brightness(1.06);
      }
      .qc-secondary:hover,
      .xr-alert-secondary:hover {
        background: rgba(255, 245, 230, 0.14);
      }
      .qc-primary:focus-visible,
      .qc-secondary:focus-visible,
      .qc-address:focus-visible,
      .xr-alert-primary:focus-visible,
      .xr-alert-secondary:focus-visible,
      .preview-badge a:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.7);
        outline-offset: 3px;
      }
      .qc-note {
        margin: 10px 0 0;
        font-size: 12px;
        color: var(--tertiary);
      }
      .qc-qr {
        flex: none;
        margin: 0;
        width: 148px;
        text-align: center;
      }
      .qc-qr svg {
        display: block;
        width: 148px;
        height: 148px;
        border-radius: 16px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.38);
      }
      .qc-qr-caption {
        margin-top: 9px;
        font-size: 11.5px;
        color: var(--tertiary);
      }
      /* A session that could not open: a clear message and an action, never a silent return. */
      .xr-alert {
        pointer-events: auto;
        width: 100%;
        max-width: 520px;
        box-sizing: border-box;
        padding: 18px 20px;
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(70, 52, 40, 0.78), rgba(40, 30, 24, 0.86));
        backdrop-filter: blur(24px) saturate(1.3);
        -webkit-backdrop-filter: blur(24px) saturate(1.3);
        box-shadow: inset 0 1px 0 rgba(255, 220, 180, 0.28), 0 14px 40px rgba(0, 0, 0, 0.4);
      }
      .xr-alert-title {
        margin: 0;
        font-size: 15.5px;
        font-weight: 650;
      }
      .xr-alert-body {
        margin: 6px 0 14px;
        font-size: 13.5px;
        line-height: 1.45;
        color: var(--secondary);
      }
      .xr-alert-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .xr-alert-actions [hidden] {
        display: none;
      }
      /* The emulated preview says what it is, and how to leave it — in the top-left corner (29 Oct, owner's
         screen: centred, it hid the lamp's question when the caption rises over the words). */
      .preview-badge {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top));
        left: calc(16px + env(safe-area-inset-left));
        /* Above the emulator's own canvas container (IWER: z-index 999) during the session. */
        z-index: 2147483000;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 7px 8px 7px 16px;
        border-radius: 999px;
        font: 500 12.5px var(--font);
        color: var(--secondary);
        background: linear-gradient(180deg, var(--glass-top), var(--glass-bottom));
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: inset 0 1px 0 var(--edge), 0 8px 24px rgba(0, 0, 0, 0.35);
        white-space: nowrap;
      }
      .preview-badge a {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 0 12px;
        border-radius: 15px;
        color: #1c1612;
        background: var(--amber);
        font-weight: 600;
        text-decoration: none;
      }
      @media (max-width: 620px) {
        .quest-card {
          flex-direction: column;
          align-items: stretch;
          gap: 0;
          padding: 22px 20px 20px;
          border-radius: 26px;
        }
        /* Room under the card for the Accessibility · Privacy line. */
        #landing {
          padding-bottom: calc(48px + env(safe-area-inset-bottom));
        }
        /* A phone cannot scan its own screen. */
        .qc-qr {
          display: none;
        }
        .qc-title {
          font-size: 23px;
        }
        .qc-lede {
          font-size: 14px;
          margin-bottom: 14px;
        }
        .qc-address {
          width: 100%;
          font-size: 16px;
        }
        .qc-actions > * {
          flex: 1 1 auto;
        }
        .bar {
          gap: 14px;
          padding-left: 18px;
        }
        .name {
          font-size: 14.5px;
        }
        .card {
          min-width: 0;
        }
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @media (prefers-reduced-motion: reduce) {
        .bar, #scene-container { transition: none; }
        #loading::after { animation: none; }
        #begin { transition: none; }
      }
          /* 28 Oct: the voice / ambience mix (two sliders under the switches). */
      .mixrow { display: grid; grid-template-columns: 1fr 9.5rem; align-items: center; gap: 0.9rem; margin: 0.65rem 0; }
      .mixrow span { display: grid; gap: 0.15rem; }
      .mixrow small { opacity: 0.7; font-size: 0.82rem; }
      .mixrow input[type='range'] { width: 100%; min-height: 44px; accent-color: #f4c27e; }
</style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="loading" role="progressbar" aria-label="Loading"></div>
    <div id="landing">
      <main class="bar" aria-labelledby="title">
        <div class="brand">
          <h1 id="title" class="name" style="margin:0">Wind-Down Desk</h1>
          <span class="sub" id="memory"></span>
        </div>
        <div class="choose" id="choose" hidden>
          <button class="card" type="button" data-style="talk"><b>Talk with the lamp</b><span>Say what is on your mind.</span></button>
          <button class="card" type="button" data-style="quiet"><b>Quiet evening</b><span>Touch only. No microphone.</span></button>
        </div>
        <button class="style" id="style" type="button" hidden></button>
        <button id="begin" type="button" aria-describedby="status">Begin</button>
        <p class="visually-hidden" id="status" aria-live="polite">Checking the agent…</p>
      </main>
      <p class="legal" translate="no">
        <button type="button" id="access-open" aria-haspopup="dialog">Accessibility</button><span class="dot" aria-hidden="true">·</span>
        <a href="/privacy.html">Privacy</a><span class="dot dot-last" aria-hidden="true">·</span>
        <span class="medical">Not therapy or medical advice</span>
      </p>
    </div>
    <dialog id="access" aria-labelledby="access-title" translate="no">
      <form method="dialog">
        <h2 id="access-title">Accessibility</h2>
        <p class="access-lede">Kept on this device. In the headset, you can also just say them.</p>
        <label class="sw"><input type="checkbox" role="switch" data-access="gazeSelect" /><span><b>Select by looking</b><small>Look at something for a moment to choose it. No hands, no voice. Say “look to select”.</small></span></label>
        <label class="sw"><input type="checkbox" role="switch" data-access="contrast" /><span><b>High contrast</b><small>White text on solid dark panels. Say “high contrast”.</small></span></label>
        <label class="sw"><input type="checkbox" role="switch" data-access="largeText" /><span><b>Larger text</b><small>Captions 30 % larger, buttons too. Say “bigger text”.</small></span></label>
        <label class="mixrow"><span><b>Lamp’s voice</b><small>Softer by default. Say “voice softer” or “voice louder”.</small></span><input type="range" min="0" max="100" step="5" data-mix="voice" aria-label="Lamp’s voice volume" /></label>
        <label class="mixrow"><span><b>Ambience</b><small>Places, rain, sounds. Say “sound softer”.</small></span><input type="range" min="0" max="100" step="5" data-mix="sound" aria-label="Ambience volume" /></label>
        <button class="access-done" value="done">Done</button>
      </form>
    </dialog>
    <script>
      // Safety net: the scene and the bar always appear, even if the app never signals it is drawn.
      setTimeout(function () {
        if (document.body.classList.contains('ready')) return;
        document.body.classList.add('ready');
        window.dispatchEvent(new Event('wdd:landing-ready'));
      }, 6000);
    </script>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
