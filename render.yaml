# Render Blueprint — Wind-Down Desk (Meta VR Start Developer Competition 2026, Productivity).
# One web service: the Node server answers /api/* (agent, speech-to-text, visits) AND serves the WebXR build (dist/).
# HTTPS comes from Render (WebXR and the microphone require a secure origin).
# Starter plan: never sleeps (no "waking up" page in front of a judge), ephemeral disk (nothing needs to persist:
# the visit log is read and saved by the owner with tools/visits-report.mjs --sauver).
# Secrets ("sync: false") are pasted once by the owner in the dashboard, by NAME; they are never in this repo.
# The deliverable link must not change from 18 Nov to 11 Dec 2026: autoDeploy stays off after submission.
services:
  - type: web
    name: wind-down-desk
    runtime: node
    plan: starter
    branch: main
    # Judges are mostly at Meta (US west coast); assets are cached a year (hashed) or an hour (panoramas).
    region: oregon
    rootDir: wind-down-desk
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # ON during development (every push redeploys); set to false the day of submission (18 Nov).
    autoDeploy: true
    envVars:
      # Node 24 runs server/*.ts directly (type stripping); wins over .nvmrc and engines.
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      # Speech-to-text: Groq, OpenAI-compatible /audio/transcriptions.
      - key: STT_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: STT_MODEL
        value: whisper-large-v3-turbo
      - key: STT_API_KEY
        sync: false
      # The agent: Gemini through its OpenAI-compatible endpoint (JSON answers; any error → on-device agent).
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_API_KEY
        sync: false
      # Gemini 3 always thinks; "low" keeps answers quick (minimal | low | medium | high).
      - key: LLM_REASONING_EFFORT
        value: low
      # 24 Oct — the lamp's dynamic voice ("Talk it through"): Gemini TTS, the owner's choice. Its key is LLM_API_KEY
      # (the same Gemini key, server side only); a TTS_API_KEY (sync: false) would override it.
      - key: TTS_MODEL
        value: gemini-3.8-flash-lite-tts
      - key: TTS_VOICE
        value: Achernar
      - key: TTS_STYLE
        value: soft, warm, almost whispered, slow and calm, like a quiet friend late at night
      # Voice budget: 60 min of the lamp's voice per visitor per day, 6 h for everyone (≈ 3.24 $/day at most).
      - key: WDD_DAILY_TTS_SECONDS_PER_IP
        value: "3600"
      - key: WDD_DAILY_TTS_SECONDS_TOTAL
        value: "21600"
      - key: WDD_DAILY_TALK_PER_IP
        value: "240"
      - key: WDD_DAILY_TALK_TOTAL
        value: "6000"
      # Cost guards (server/guards.ts). Over a limit: 429, and the app carries on with its on-device agent.
      - key: WDD_DAILY_STT_PER_IP
        value: "150"
      - key: WDD_DAILY_AGENT_PER_IP
        value: "300"
      - key: WDD_DAILY_STT_TOTAL
        value: "4000"
      - key: WDD_DAILY_AGENT_TOTAL
        value: "8000"
      # Gemini 3.8 Flash, read 22 Oct 2026: $0.75 / 1M input, $3.75 / 1M output (thinking included) until 31 Dec.
      # 1M tokens/day ≈ 140 evenings (≈ 7k tokens each) → at most $0.75–3.75 a day even if abused.
      # Groq Whisper turbo: $0.04 per audio hour, 10 s minimum per request → 4000 clips ≤ 45 s ≤ $2 a day.
      - key: WDD_DAILY_LLM_TOKENS
        value: "1000000"
      - key: WDD_MAX_AUDIO_BYTES
        value: "600000"
      # Browser calls only from the site itself (RENDER_EXTERNAL_URL, set by Render); no LAN origins in production.
      - key: WDD_ALLOW_LAN_ORIGINS
        value: "0"
      # Landing card on devices without a headset (read at BUILD time by Vite): the demo video link, https only.
      # Empty = the "Watch the demo" button is hidden. After changing it: Manual Deploy → "Clear build cache & deploy".
      - key: VITE_WDD_DEMO_URL
        value: ""
      # Anonymous visit log: salt for the one-way visitor ids (generated by Render, stable across restarts) and the
      # owner's export token (zsh tools/visits-token.sh creates it, keeps it in the Keychain and copies it once).
      - key: WDD_VISITS_SALT
        generateValue: true
      - key: WDD_VISITS_TOKEN
        sync: false
